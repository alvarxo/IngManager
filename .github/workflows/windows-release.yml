# Builds Windows x64 NSIS installer + bare IngManager.exe on windows-latest.
# This workflow cannot run on the Linux Cloud Agent VM — push the repo to GitHub
# and trigger via tag `v*` or workflow_dispatch, then download the artifacts.
name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-nsis:
    name: Build NSIS + bare exe
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (NSIS)
        # Produces:
        #   src-tauri/target/release/IngManager.exe
        #   src-tauri/target/release/bundle/nsis/IngManager_*_x64-setup.exe
        run: pnpm tauri build --bundles nsis

      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          $exe = Get-ChildItem -Path "src-tauri/target/release/IngManager.exe" -ErrorAction Stop
          Copy-Item $exe.FullName "dist-windows/IngManager.exe"

          $setup = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*-setup.exe" |
            Select-Object -First 1
          if (-not $setup) {
            throw "NSIS setup exe not found under bundle/nsis"
          }
          # Canonical distribution name requested by product docs
          Copy-Item $setup.FullName "dist-windows/IngManager_Setup.exe"
          Copy-Item $setup.FullName ("dist-windows/" + $setup.Name)

          Get-ChildItem dist-windows | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IngManager-windows-x64
          path: |
            dist-windows/IngManager_Setup.exe
            dist-windows/IngManager.exe
            dist-windows/*-setup.exe
          if-no-files-found: error
          retention-days: 30
